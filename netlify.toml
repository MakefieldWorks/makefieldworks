[build]
  publish = "."

[[redirects]]
  from = "/design_language/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/logo-directions.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/logo-confluence-grid.svg"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/logo-makers-stamp.svg"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/logo-workshop-frame.svg"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/design_language/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
