<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found · Makefield Works</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="site.css">
  <style>
    .not-found {
      min-height: calc(100vh - 79px);
      display: grid;
      place-items: center;
      padding: 48px 0;
    }

    .not-found-card {
      width: min(680px, 100%);
      padding: 32px;
      border: 1px solid var(--mw-paper-rule);
      border-radius: var(--mw-radius-xl);
      background: rgba(255, 255, 255, 0.66);
    }

    .not-found-card p {
      margin: 16px 0 0;
      color: var(--mw-ink-2);
      max-width: 48ch;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell topbar">
      <a class="site-mark" href="index.html" aria-label="Makefield Works home">
        <img class="site-mark__icon" src="assets/makefield-works-mark.svg" alt="">
        <span>Makefield Works</span>
      </a>
    </div>
  </header>

  <main class="not-found">
    <div class="shell">
      <section class="not-found-card">
        <p class="section-heading__eyebrow">404</p>
        <h1>That page is not part of the public site.</h1>
        <p>
          The public Makefield Works site is intentionally small and focused. Head back
          to the main page to browse the products and the studio overview.
        </p>
        <div class="hero-actions">
          <a class="button button--solid" href="index.html">Back to home</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
